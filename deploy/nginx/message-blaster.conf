# Example nginx site for message-blaster behind HTTPS.
# Install: copy to /etc/nginx/conf.d/ (or sites-available + symlink), replace
# blaster.example.com and the certificate paths, keep 3000 in sync with WEB_PORT,
# set WEB_PUBLIC_ORIGIN=https://blaster.example.com, then `nginx -t && systemctl reload nginx`.
# This file is included inside the `http {}` block, so the zone and log format live here.

# Per-client rate limit for the Google sign-in endpoints.
limit_req_zone $binary_remote_addr zone=blaster_auth:10m rate=10r/m;

# Paths only ($uri has no query string); no Referer, Cookie or Authorization headers.
log_format blaster_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent $request_time "$http_user_agent"';

upstream message_blaster {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name blaster.example.com;
    access_log off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name blaster.example.com;

    ssl_certificate     /etc/letsencrypt/live/blaster.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blaster.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/message-blaster.access.log blaster_safe;

    # Uploads are capped at 10 MB each by the app (plus multipart overhead).
    client_max_body_size 11m;

    # Shared proxy settings. $http_host keeps the browser's Host exactly, including a
    # nonstandard port; the app rejects requests whose Host differs from WEB_PUBLIC_ORIGIN.
    # Origin is forwarded unchanged by default (nginx does not rewrite it).
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://message_blaster;
    }

    # Server-sent events for live campaign updates: no buffering, long-lived.
    location = /api/events {
        proxy_pass http://message_blaster;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location = /auth/google {
        limit_req zone=blaster_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://message_blaster;
    }

    location = /auth/callback {
        limit_req zone=blaster_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://message_blaster;
    }
}
