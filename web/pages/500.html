<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="description" content="The dashboard hit an unexpected error.">
    <title>Something went wrong | Message Blaster</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preload" href="/fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/brand.css">
    <link rel="stylesheet" href="/pages.css">
    <script src="/vendor/lucide.js"></script>
    <script src="/vendor/lottie.js" defer></script>
    <script type="module" src="/pages/page.mjs"></script>
</head>
<body class="status-page" data-kind="server-error">
    <main class="status-shell">
        <a class="brand page-brand" href="/" aria-label="Message Blaster home">
            <span class="brand-mark"><i data-icon="megaphone" data-size="15"></i></span>
            <span class="brand-name">Message Blaster</span>
        </a>
        <div class="status-art" role="img" aria-label="A typing chat bubble cracks and its dots fall away.">
            <div class="status-player" data-animation="/animations/broken-signal.json"></div>
        </div>
        <section class="status-copy" aria-labelledby="status-title">
            <p class="status-code">Error 500</p>
            <h1 id="status-title">The dashboard lost its signal</h1>
            <p>The server hit an error it didn’t expect while loading this page. Select Retry to load it again. If it keeps happening, check the terminal running <code>npm run web</code> for the error details.</p>
            <div class="status-actions">
                <button class="status-button primary" type="button" data-action="retry"><i data-icon="rotate-ccw"></i><span>Retry</span></button>
                <a class="status-button" href="/"><i data-icon="arrow-left"></i><span>Back to campaigns</span></a>
            </div>
        </section>
    </main>
</body>
</html>
